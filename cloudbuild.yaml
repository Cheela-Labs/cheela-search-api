# Cloud Build → Artifact Registry → Cloud Run.
#
# Attach a trigger to the `cheela-search-api` mirror, not to this monorepo:
# the Dockerfile's context is this directory, and at the mirror root that is
# the whole repo. Pointing a trigger at the monorepo hands Docker the wrong
# context and the build fails on files it cannot see.
#
#   gcloud builds triggers create github \
#     --name=search-api-main \
#     --repo-owner=Cheela-Labs --repo-name=cheela-search-api \
#     --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml
#
# One image, four deployables:
#
#   search-api            Cloud Run service, the request path
#   search-api-migrate    Job, runs before any revision serves
#   search-api-worker     Job, drains the event streams (see below)
#   search-api-scheduler  Job, recomputes crawl priorities
#
# The worker is a Job rather than a service, and that is a cost decision worth
# stating: a stream consumer needs CPU allocated between requests, and
# always-allocated CPU on Cloud Run is roughly $46/month for one vCPU. A Job on
# a five-minute schedule is a few dollars, and it buys indexing latency measured
# in minutes for work the user never waits on. WORKER_DRAIN_MS is what makes the
# same binary exit when the backlog is empty.

substitutions:
  _REGION: asia-southeast1
  _SERVICE: search-api
  _REPO: search-api
  # Names only, never full identifiers containing ${PROJECT_ID}. Cloud Build
  # does NOT expand built-in substitutions inside user substitution *defaults* —
  # only inside `args`. Written the obvious way, the deploy is handed the literal
  # string `search-api@${PROJECT_ID}.iam.gserviceaccount.com` and fails with
  # "Permission 'iam.serviceAccounts.actAs' denied on service account
  # search-api@${PROJECT_ID}...", which looks like a missing IAM grant rather
  # than an unexpanded variable.
  _SERVICE_ACCOUNT_NAME: search-api
  _MIGRATE_JOB: search-api-migrate
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "4"
  # Cloud Run reaches Cloud SQL over a unix socket mounted into the container,
  # not over TCP — so the instance needs no public IP and no allowlist, and the
  # database is unreachable from the internet entirely.
  _SQL_INSTANCE_NAME: cheela-search
  # Vespa and Memorystore are on private addresses in the default VPC. Direct
  # VPC egress rather than a Serverless VPC Access connector: same reachability,
  # no connector instances to pay for or scale. `private-ranges-only` keeps
  # public egress — which is most of what this service does — on the normal
  # path rather than hairpinning it through the VPC.
  _NETWORK: default
  _SUBNET: default

options:
  logging: CLOUD_LOGGING_ONLY

# $BUILD_ID rather than $SHORT_SHA for the immutable tag. SHORT_SHA is populated
# only when a *trigger* runs the build; `gcloud builds submit` from a working
# directory leaves it empty, and the failure is `invalid image name "...:"` —
# which points at the image name rather than at the missing variable. BUILD_ID
# is set in both paths and is unique per build, and Cloud Build's own history
# maps a build back to its commit, so nothing is lost by not putting the sha in
# the tag.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    # Load-bearing, not boilerplate. The Dockerfile writes pnpm-workspace.yaml
    # with a heredoc (`COPY <<-'YAML'`), which is BuildKit-only syntax, and this
    # builder runs the legacy engine unless told otherwise. Without it the build
    # fails at that line with `COPY failed: no source files were specified` —
    # which reads as a missing file rather than an unsupported instruction.
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  # Pushed here, in a step, rather than through the top-level `images:` key.
  # That key pushes only after every step has finished — which is after the
  # deploy step below has already tried to pull the tag, and the failure reads
  # as `Image ... not found` with no hint that it simply had not been pushed yet.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  # ---------------------------------------------------------------------------
  # Migrate, BEFORE the deploy.
  #
  # `jobs deploy` is create-or-update, so a fresh project needs no bootstrap,
  # and `execute --wait` makes a failed migration fail the build before any
  # revision is created. The migration entrypoint reads DATABASE_URL and nothing
  # else — deliberately, so a schema change never needs a Vespa endpoint, a
  # Redis, two search vendors and a model key to be applied.
  # ---------------------------------------------------------------------------
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run jobs deploy ${_MIGRATE_JOB} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID} \
          --region=${_REGION} \
          --service-account=${_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE_NAME} \
          --set-secrets=DATABASE_URL=search-database-url:latest \
          --command=node --args=dist/migrate.js \
          --max-retries=0 \
          --task-timeout=600s
        gcloud run jobs execute ${_MIGRATE_JOB} --region=${_REGION} --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed

      # Public: the surface calls this through its own route handler. The
      # allowlist that matters is ALLOWED_ORIGINS in the service, not ingress.
      - --allow-unauthenticated
      - --ingress=all

      # Not the default compute service account — an SSRF that reaches the
      # metadata server steals whatever this identity can do, so it should be
      # able to do almost nothing. It can read five secrets and reach one
      # database, and that is the whole of its authority.
      - --service-account=${_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com

      # Scale to zero while the budget is the constraint. Max is a cost ceiling,
      # not a capacity plan; raise it deliberately.
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}

      - --timeout=300
      - --concurrency=40

      # gen2 for a better network stack — this service's whole job is outbound
      # fetching, and gen1's is noticeably worse at it. Direct VPC egress also
      # requires gen2.
      - --execution-environment=gen2

      # 1Gi rather than 512Mi: `/index/document` parses HTML with linkedom on
      # the request path, and a 2MB page costs several hundred megabytes to
      # build a DOM for. At 512Mi that is an OOM kill rather than a slow request.
      - --cpu=1
      - --memory=1Gi

      - --network=${_NETWORK}
      - --subnet=${_SUBNET}
      - --vpc-egress=private-ranges-only

      - --set-env-vars=NODE_ENV=production,SEARCH_API_TOKEN_MODE=observe,GCS_RAW_BUCKET=${PROJECT_ID}_${_REGION}_search-raw,OTEL_ENABLED=true,GCP_PROJECT_ID=${PROJECT_ID}
      - --add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE_NAME}

      # Secrets, never environment variables in this file. The values live in
      # Secret Manager and the runtime identity can read these and nothing else;
      # a credential pasted here would be in git and in every build log.
      #
      # MODEL_API_KEY reads search-composer-api-key, whose name no longer
      # matches: the variable was renamed when one credential started serving
      # the classifier, the expander and the generator, and renaming the secret
      # would mean two places to rotate one key. tooling/secrets.mjs maps them.
      #
      # SEARCH_API_TOKEN_MODE stays `observe` until the surface is confirmed to
      # be sending the token. Enabling enforcement first 401s every real
      # request; `/health` stays outside the gate either way, so Cloud Run's
      # probes — which carry no headers — keep passing.
      - --set-secrets=DATABASE_URL=search-database-url:latest,TAVILY_API_KEY=search-tavily-api-key:latest,ANYSEARCH_API_KEY=search-anysearch-api-key:latest,MODEL_API_KEY=search-composer-api-key:latest,SEARCH_API_TOKEN=search-api-token:latest,VESPA_ENDPOINT=search-vespa-endpoint:latest,REDIS_URL=search-redis-url:latest,EVENT_SIGNING_KEY=search-event-signing-key:latest

  # ---------------------------------------------------------------------------
  # The background Jobs.
  #
  # Deployed but not executed: the worker is driven by Cloud Scheduler and the
  # scheduler by its own trigger. Running them here would put a crawl inside a
  # deploy, which is a slow deploy and a surprising crawl.
  #
  # Both need the VPC (Vespa and Redis) and Cloud SQL. Neither is public and
  # neither listens on a port.
# No background Jobs.
#
# `search-api-worker` and `search-api-scheduler` were deployed from here and
# are gone: ingestion moved to apps/search-console (ADR-003) and `worker.ts`
# and `scheduler.ts` went with it. tsup builds two entrypoints now, so these
# deployments pointed at `dist/worker.js` and `dist/scheduler.js`, neither of
# which the image contains — the next deploy would have created two Jobs that
# crash on start and a schedule pointing at them.
#
# This service serves queries. The Console owns everything that runs on a timer.

timeout: 1200s
